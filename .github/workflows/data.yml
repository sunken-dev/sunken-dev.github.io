# Keeps the project data on the orphan `data` branch current
name: Refresh project data

on:
  schedule:
    # nightly, off the hour so it does not land in the busiest minute
    - cron: "17 2 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A second run would race the first for the same branch
concurrency:
  group: "project-data"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Collect projects
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/collect-projects.py

      # The data branch is orphaned and holds nothing but this file, so it is
      # cloned on its own rather than switched to inside the main worktree.
      - name: Publish to the data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git clone --depth 1 --branch data "$remote" data-branch 2>/dev/null; then
            echo "updating existing data branch"
          else
            echo "creating the data branch"
            git init -q data-branch
            git -C data-branch checkout -q -b data
            git -C data-branch remote add origin "$remote"
          fi

          cp projects.json data-branch/projects.json
          cd data-branch
          git add projects.json
          if git diff --cached --quiet; then
            echo "project data unchanged"
            exit 0
          fi
          git commit -q -m "Refresh project data"
          git push -q origin data
          echo "project data published"
