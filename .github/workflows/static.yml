# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations follow the checkout, so the token must not stay in the local git config
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # The real social preview is only exposed through the GraphQL API, which
      # requires a token, so the list is resolved here and published as static
      # JSON rather than fetched from the browser. Failure is tolerated: the
      # page falls back to the anonymous REST API.
      - name: Collect projects
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016  # $org is a GraphQL variable, not a shell one
          gh api graphql -f query='
            query($org: String!) {
              organization(login: $org) {
                repositories(first: 100, privacy: PUBLIC, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes {
                    name description url homepageUrl isFork
                    openGraphImageUrl usesCustomOpenGraphImage
                    primaryLanguage { name }
                    repositoryTopics(first: 10) { nodes { topic { name } } }
                  }
                }
              }
            }' -F org=sunken-dev --jq '
              [ .data.organization.repositories.nodes[]
                | select(.isFork | not)
                | select(.name != "sunken-dev.github.io")
                | { name, description, url,
                    homepage: .homepageUrl,
                    image: .openGraphImageUrl,
                    customImage: .usesCustomOpenGraphImage,
                    language: (.primaryLanguage.name // null),
                    topics: [ .repositoryTopics.nodes[].topic.name ] } ]' > projects.json
          echo "collected $(jq length projects.json) projects"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
