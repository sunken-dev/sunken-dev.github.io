# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No git operations follow the checkout, so the token must not stay in the local git config
          persist-credentials: false
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # A repository's social preview is only published in the og:image tag of
      # its public page - the same tag WhatsApp and other scrapers read. A
      # browser cannot read it because GitHub sends no CORS header on HTML, so
      # it is resolved here and written beside the page. Failure is tolerated:
      # the page falls back to the REST API and its generated cards.
      - name: Collect projects
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request

          ORG = 'sunken-dev'
          SELF = 'sunken-dev.github.io'

          def get(url, accept=None, token=None):
              headers = {'User-Agent': 'sunken-dev-pages'}
              if accept:
                  headers['Accept'] = accept
              if token:
                  headers['Authorization'] = 'Bearer ' + token
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode('utf-8', 'replace')

          def social_preview(html):
              # attribute order is not fixed, so match the tag then the value
              tag = re.search(r'<meta[^>]*property=["\']og:image["\'][^>]*>', html)
              if not tag:
                  return None
              value = re.search(r'content=["\']([^"\']+)["\']', tag.group(0))
              return value.group(1) if value else None

          token = os.environ.get('GH_TOKEN')
          repos = json.loads(get(
              f'https://api.github.com/orgs/{ORG}/repos?per_page=100&sort=updated',
              'application/vnd.github+json', token))

          projects = []
          for repo in repos:
              if repo['fork'] or repo['name'] == SELF:
                  continue
              try:
                  image = social_preview(get(repo['html_url']))
              except Exception as error:
                  print(f"  {repo['name']}: no preview ({error})")
                  image = None
              projects.append({
                  'name': repo['name'],
                  'description': repo['description'],
                  'url': repo['html_url'],
                  'homepage': repo['homepage'],
                  'image': image,
                  'language': repo['language'],
                  'topics': repo.get('topics') or [],
              })

          with open('projects.json', 'w') as handle:
              json.dump(projects, handle, indent=2)
          print(f'collected {len(projects)} projects')
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
